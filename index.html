<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f1e6">
<title>المزاريطة فارم</title>
<style>
:root {
  --bg:#f8f3e8;
  --green:#4f651c;
  --green2:#6f8b2d;
  --gold:#c19a46;
  --text:#2f322b;
  --muted:#74756f;
  --card:#fffdfa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 8%, rgba(117,145,58,.08), transparent 22%),
    radial-gradient(circle at 85% 10%, rgba(117,145,58,.07), transparent 20%),
    linear-gradient(180deg,#fbf7ef 0%,#f6efe0 100%);
  font-family:Tahoma, Arial, "Segoe UI", sans-serif;
  color:var(--text);
}
.page{
  width:min(100%,520px);
  margin:auto;
  min-height:100vh;
  padding:24px 18px 120px;
  position:relative;
  overflow:hidden;
}
.leaf{
  position:absolute;
  width:110px;height:110px;
  opacity:.14;
  pointer-events:none;
}
.leaf.left{left:-38px;top:8px;transform:rotate(-28deg)}
.leaf.right{right:-40px;top:20px;transform:rotate(30deg)}
.brand{text-align:center;position:relative;z-index:2}
.logo-wrap{
  width:180px;
  height:180px;
  margin:0 auto 18px;
  background:transparent;
  border-radius:50%;
  overflow:hidden;
}
.logo-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  border-radius:50%;
  clip-path:circle(49% at 50% 50%);
  transform:scale(1.035);
}
h1{
  margin:0;
  color:var(--green);
  font-size:clamp(29px,7.5vw,41px);
  line-height:1.35;
  font-weight:900;
  letter-spacing:-.2px;
}
.subtitle{
  margin:10px 0 0;
  font-size:16px;
  color:var(--muted);
}
.gold-line{
  width:95px;height:3px;border-radius:20px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:18px auto 24px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  position:relative;
  z-index:2;
}
.card{
  min-height:190px;
  padding:22px 14px 18px;
  text-decoration:none;
  color:var(--text);
  border-radius:27px;
  background:rgba(255,253,250,.96);
  box-shadow:0 13px 30px rgba(85,67,36,.12);
  border:1px solid rgba(151,124,73,.08);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  gap:13px;
  transition:.18s ease;
  -webkit-tap-highlight-color:transparent;
}
.card:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(85,67,36,.15)}
.card:active{transform:scale(.98)}
.icon{
  width:82px;height:82px;border-radius:50%;
  display:grid;place-items:center;
}
.icon svg{width:50px;height:50px}
.facebook .icon{background:#eef5ff}
.whatsapp .icon{background:#eafaf0}
.gallery .icon{background:#fff2d2}
.farm .icon{background:#eef4dc}
.menu .icon{background:#fff0df}
.card strong{font-size:18px;line-height:1.45;font-weight:900}
.card span{font-size:12px;color:var(--muted);line-height:1.5}
.footer-title{
  position:relative;z-index:2;
  text-align:center;
  margin-top:28px;
  color:#676b60;
  font-size:13px;
}
.footer-title:before,.footer-title:after{
  content:"";
  display:inline-block;
  width:52px;height:2px;
  background:var(--gold);
  vertical-align:middle;
  margin:0 10px;
  opacity:.8;
}
.landscape{
  position:absolute;
  left:-10%;right:-10%;bottom:-65px;
  height:150px;
  z-index:1;
  pointer-events:none;
}
.hill1,.hill2,.hill3{
  position:absolute;
  bottom:0;
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
}
.hill1{left:-5%;width:65%;height:92px;background:#9fba5b;transform:rotate(3deg)}
.hill2{right:-8%;width:70%;height:105px;background:#7e9c3c;transform:rotate(-3deg)}
.hill3{left:25%;width:70%;height:70px;background:#b7cb76}
.fence{
  position:absolute;left:4%;bottom:54px;width:110px;height:44px;
  border-bottom:8px solid #9a6b3c;
  border-top:8px solid #9a6b3c;
  opacity:.9;
}
.fence:before,.fence:after{
  content:"";position:absolute;width:9px;height:58px;background:#80562f;bottom:-13px;border-radius:4px
}
.fence:before{left:20px} .fence:after{right:20px}
.barn{
  position:absolute;right:8%;bottom:56px;width:62px;height:54px;background:#b45a38;border-radius:4px
}
.barn:before{
  content:"";position:absolute;left:-8px;top:-28px;
  border-left:39px solid transparent;border-right:39px solid transparent;
  border-bottom:34px solid #7c4b2c;
}
.barn:after{
  content:"";position:absolute;left:24px;bottom:0;width:16px;height:28px;background:#f0d8ad
}
@media(max-width:380px){
  .page{padding-left:14px;padding-right:14px}
  .grid{gap:12px}
  .card{min-height:172px;padding:18px 10px}
  .icon{width:70px;height:70px}
  .icon svg{width:44px;height:44px}
  .card strong{font-size:16px}
  .logo-wrap{width:155px;height:155px}
}
</style>
</head>
